name: Hexlet project check

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db-1:
        image: postgres:15
        env:
          POSTGRES_DB: hexlet
          POSTGRES_USER: hexlet
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Run linter and tests
        run: |
          make setup
          make test
        env:
          DATABASE_URL: postgresql://hexlet:secretpassword@localhost:5432/hexlet