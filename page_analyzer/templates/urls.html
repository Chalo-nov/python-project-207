<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Analizador de Páginas - Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1>Lista de Sitios</h1>
        
        <table class="table table-striped mt-3" data-test="urls">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Última revisión</th>
                    <th>Código de estado</th>
                </tr>
            </thead>
            <tbody>
                {% for url in urls %}
                <tr>
                    <td>{{ url.id }}</td>
                    <td><a href="{{ url_for('show_url', id=url.id) }}">{{ url.name }}</a></td>
                    <td>{{ url.last_check_at }}</td>
                    <td>{{ url.status_code }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
