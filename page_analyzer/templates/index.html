<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analizador de Páginas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-4">Analizador de Páginas</h1>

      <!-- Bloque para mostrar mensajes flash -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }}" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="card shadow-sm p-4">
        <form action="{{ url_for('add_url') }}" method="post">
          <div class="mb-3">
            <label for="url" class="form-label">Sitio web</label>
            <input type="text" class="form-control" id="url" name="url" placeholder="https://www.ejemplo.com" value="{{ url or '' }}">
          </div>
          <button type="submit" class="btn btn-primary">Extraer</button>
        </form>
      </div>
    </div>
  </body>
</html>
